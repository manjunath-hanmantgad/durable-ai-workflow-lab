          <path data-composition-edge-from="receiver" data-composition-edge-to="db" data-composition-edge-id="select" data-composition-points="298,420;452.5,420" d="M 298 420 L 452.5 420" class="a-default" data-animate="edge" style="--step:5" stroke-width="1.4" marker-end="url(#arrowhead)"/>
        <g data-detail="context">
          <rect x="296.65" y="400" width="157.2" height="18" rx="3" class="c-mask"/>
          <text x="375.25" y="410" class="t-muted" font-size="11" text-anchor="middle">SELECT existing result</text>
        </g>

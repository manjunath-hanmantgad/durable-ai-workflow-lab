          <path data-composition-edge-from="db" data-composition-edge-to="receiver" data-composition-edge-id="commit-ok" data-composition-points="452.5,230;298,230" d="M 452.5 230 L 298 230" class="a-default" data-animate="edge" style="--step:2" stroke-width="1.4" stroke-dasharray="3,5" marker-end="url(#arrowhead)"/>
        <g data-detail="context">

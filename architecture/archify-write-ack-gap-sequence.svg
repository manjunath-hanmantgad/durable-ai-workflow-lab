        <rect data-graph-role="structural-frame" data-composition-frame-kind="segment" data-composition-frame-id="1" x="48" y="290" width="464" height="50" rx="10" class="c-lane" stroke-width="1"/>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="segment" data-composition-frame-id="2" x="48" y="360" width="464" height="140" rx="10" class="c-lane" stroke-width="1"/>

        <!-- Lifelines -->
        <path d="M 122.5 142 L 122.5 502" class="a-default" stroke-width="0.8" stroke-dasharray="3,7"/>
        <path d="M 291 142 L 291 502" class="a-default" stroke-width="0.8" stroke-dasharray="3,7"/>
        <path d="M 459.5 142 L 459.5 502" class="a-default" stroke-width="0.8" stroke-dasharray="3,7"/>


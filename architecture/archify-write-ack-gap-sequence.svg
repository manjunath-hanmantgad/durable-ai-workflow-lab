          <text x="206.75" y="470" class="t-muted" font-size="11" text-anchor="middle">original ticket_id</text>
        </g>
        </g>

        <!-- Segment Labels -->
        <g data-graph-role="segment-label" data-segment-id="0">
          <rect x="56" y="188" width="81.60000000000001" height="18" rx="3" class="c-mask"/>
          <text x="62" y="201" class="t-muted" font-size="9" font-weight="600">First attempt</text>
        </g>
        <g data-graph-role="segment-label" data-segment-id="1">

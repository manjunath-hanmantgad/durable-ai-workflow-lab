        <g data-edge-from="db" data-edge-to="receiver" data-edge-label="ticket found" data-edge-key="6" data-edge-id="found">
          <path data-composition-edge-from="db" data-composition-edge-to="receiver" data-composition-edge-id="found" data-composition-points="452.5,450;298,450" d="M 452.5 450 L 298 450" class="a-default" data-animate="edge" style="--step:6" stroke-width="1.4" stroke-dasharray="3,5" marker-end="url(#arrowhead)"/>

          <text data-node-label="" data-detail-anchor="" x="291" y="108" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Receiver</text>
          <text data-detail="context" x="291" y="122" class="t-muted" font-size="7" text-anchor="middle">MockReceiver</text>
        </g>

        <g id="node-db" data-node-id="db" data-node-label="SQLite" tabindex="0" role="button" aria-label="Focus SQLite, UNIQUE(command_key), Sequence participant" aria-pressed="false" data-node-kind="database" data-node-sublabel="UNIQUE(command_key)" data-node-context="Sequence participant">

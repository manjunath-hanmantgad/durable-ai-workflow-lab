[project]
name = "durable-ai-workflow-lab"
version = "0.1.0"
description = "P01: minimal proof of the write/ack gap and receiver idempotency"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p01"]

[tool.pytest.ini_options]
testpaths = ["tests"]
